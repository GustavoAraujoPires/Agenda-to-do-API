<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda de Tarefas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:#ececec;

            font-family:'Segoe UI',sans-serif;
        }

        .card-auth{

            width:380px;

            background:white;

            border-radius:35px;

            overflow:hidden;

            box-shadow:
                    0 15px 40px rgba(0,0,0,.12);

            animation:fade .5s ease;
        }

        .header{

            background:#111;

            height:180px;

            color:white;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

            position:relative;
        }

        .header::before{

            content:"";

            position:absolute;

            width:100%;
            height:100%;

            background:
                    radial-gradient(circle at 30% 30%,#222 10%,transparent 10%),
                    radial-gradient(circle at 70% 40%,#222 10%,transparent 10%),
                    radial-gradient(circle at 50% 80%,#222 10%,transparent 10%);

            opacity:.6;
        }

        .header i{

            font-size:55px;

            z-index:2;
        }

        .header h2{

            margin-top:15px;

            z-index:2;
        }

        .content{

            padding:35px;
        }

        .form-control,
        .form-select{

            border:none;

            background:#f5f5f5;

            padding:14px;

            border-radius:14px;
        }

        .form-control:focus,
        .form-select:focus{

            box-shadow:none;

            border:1px solid #111;
        }

        .btn-auth{

            width:100%;

            padding:14px;

            border:none;

            border-radius:14px;

            background:#111;

            color:white;

            font-weight:600;

            transition:.3s;
        }

        .btn-auth:hover{

            transform:translateY(-2px);
        }

        .link-auth{

            text-align:center;

            margin-top:20px;
        }

        .link-auth a{

            text-decoration:none;

            font-weight:bold;

            cursor:pointer;
        }

        .alert{
            display:none;
        }

    </style>

</head>

<body>

<div class="card-auth">

    <div class="header">

        <i class="bi bi-list-check"></i>

        <h2>Agenda</h2>

    </div>

    <div class="content">

        <div id="mensagem"
             class="alert alert-success">
        </div>

        <!-- LOGIN -->

        <form id="formLogin"
              method="post"
              th:action="@{/login}">

            <h3 class="text-center mb-4">

                Login

            </h3>

            <div class="mb-3">

                <label>Nome</label>

                <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Digite seu login"
                        required>

            </div>

            <div class="mb-4">

                <label>Senha</label>

                <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Digite sua senha"
                        required>

            </div>

            <button
                    type="submit"
                    class="btn-auth">

                Entrar

            </button>

            <div class="link-auth">

                Não possui conta?

                <a onclick="mostrarCadastro()">

                    Cadastre-se

                </a>

            </div>

        </form>

        <!-- CADASTRO -->

        <form id="formCadastro"
              style="display:none;">

            <h3 class="text-center mb-4">

                Criar Conta

            </h3>

            <div class="mb-3">

                <label>Nome</label>

                <input
                        type="text"
                        id="cadastroLogin"
                        class="form-control"
                        placeholder="Escolha um login"
                        required>

            </div>

            <div class="mb-3">

                <label>Senha</label>

                <input
                        type="password"
                        id="cadastroSenha"
                        class="form-control"
                        placeholder="Crie uma senha"
                        required>

            </div>

            <div class="mb-4">

                <label>Perfil</label>

                <select
                        id="role"
                        class="form-select">

                    <option value="USUARIO">

                        Usuário

                    </option>

                    <option value="ADMIN">

                        Admin

                    </option>

                </select>

            </div>

            <button
                    type="submit"
                    class="btn-auth">

                Criar Conta

            </button>

            <div class="link-auth">

                Já possui conta?

                <a onclick="mostrarLogin()">

                    Fazer Login

                </a>

            </div>

        </form>

    </div>

</div>

<script>

    function mostrarCadastro(){

        document
            .getElementById("formLogin")
            .style.display = "none";

        document
            .getElementById("formCadastro")
            .style.display = "block";
    }

    function mostrarLogin(){

        document
            .getElementById("formCadastro")
            .style.display = "none";

        document
            .getElementById("formLogin")
            .style.display = "block";
    }

    document
        .getElementById("formCadastro")
        .addEventListener("submit", async function(event){

            event.preventDefault();

            const usuario = {

                login:
                    document
                        .getElementById("cadastroLogin")
                        .value,

                senha:
                    document
                        .getElementById("cadastroSenha")
                        .value,

                roles:[
                    document
                        .getElementById("role")
                        .value
                ]
            };

            try{

                const response =
                    await fetch("/usuarios",{

                        method:"POST",

                        headers:{
                            "Content-Type":"application/json"
                        },

                        body:JSON.stringify(usuario)
                    });

                const mensagem =
                    document.getElementById("mensagem");

                if(response.ok){

                    mensagem.className =
                        "alert alert-success";

                    mensagem.style.display =
                        "block";

                    mensagem.innerText =
                        "Usuário criado com sucesso!";

                    document
                        .getElementById("formCadastro")
                        .reset();

                    setTimeout(() => {

                        mostrarLogin();

                    },1500);

                }else{

                    mensagem.className =
                        "alert alert-danger";

                    mensagem.style.display =
                        "block";

                    mensagem.innerText =
                        "Erro ao cadastrar usuário.";
                }

            }catch(error){

                document
                    .getElementById("mensagem")
                    .className =
                    "alert alert-danger";

                document
                    .getElementById("mensagem")
                    .style.display =
                    "block";

                document
                    .getElementById("mensagem")
                    .innerText =
                    "Erro ao conectar com o servidor.";
            }
        });

</script>

</body>
</html>
