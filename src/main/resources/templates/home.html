<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Agenda de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand"> Agenda de Tarefas </span>

        <form action="/logout" method="post">
            <button class="btn btn-danger"> Sair </button>
        </form>

    </div>

</nav>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Total</h5>
                    <h1 id="totalTarefas">0</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Pendentes</h5>
                    <h1 id="pendentes">0</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Concluídas</h5>
                    <h1 id="concluidas">0</h1>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header"> Nova Tarefa  </div>
        <div class="card-body">
            <form id="formTarefa">
                <input type="hidden" id="tarefaId"> <div class="mb-3">

                <label>Título</label>
                <input id="titulo" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Descrição</label>
                    <textarea id="descricao" class="form-control"> </textarea>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <label>Data Início</label>
                        <input type="date" id="dataInicio" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label>Data Limite</label>
                        <input type="date" id="dataLimite" class="form-control" required>
                    </div>

                </div>

                <button type="submit" id="btnSalvar" class="btn btn-primary mt-4"> Salvar Tarefa </button>

            </form>

        </div>

    </div>

    <!-- TABELA -->

    <div class="card shadow">

        <div class="card-header">

            Lista de Tarefas

        </div>

        <div class="card-body">

            <table class="table table-striped">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Título</th>
                    <th>Data Limite</th>
                    <th>Status</th>
                    <th>Ações</th>

                </tr>

                </thead>

                <tbody id="tabelaTarefas">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

    const API = "/tarefas";

    document
    .getElementById("formTarefa")
    .addEventListener("submit", salvarTarefa);

    async function salvarTarefa(event){

        event.preventDefault();

        const id =
            document.getElementById("tarefaId").value;

        const tarefa = {

            titulo:
                document.getElementById("titulo").value,

            descricao:
                document.getElementById("descricao").value,

            dataInicio:
                document.getElementById("dataInicio").value,

            dataLimite:
                document.getElementById("dataLimite").value
        };

        if(id){

            await fetch(`${API}/${id}`,{

                method:"PUT",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(tarefa)

            });

        }else{

            await fetch(API,{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(tarefa)

            });
        }

        document.getElementById("formTarefa").reset();

        document.getElementById("tarefaId").value = "";

        document.getElementById("btnSalvar").innerText =
            "Salvar Tarefa";

        carregarTarefas();
    }

    async function carregarTarefas(){

        const response =
            await fetch(API);

        const tarefas =
            await response.json();

        const tabela =
            document.getElementById("tabelaTarefas");

        tabela.innerHTML = "";

        let concluidas = 0;
        let pendentes = 0;

        tarefas.forEach(tarefa => {

            if(tarefa.statusTarefa === "CONCLUIDA"){
                concluidas++;
            }else{
                pendentes++;
            }

            tabela.innerHTML += `

            <tr>

                <td>${tarefa.id}</td>

                <td>${tarefa.titulo}</td>

                <td>${tarefa.dataLimite}</td>

                <td>

                    ${
                        tarefa.statusTarefa === "CONCLUIDA"

                        ?

                        '<span class="badge bg-success">Concluída</span>'

                        :

                        '<span class="badge bg-warning">Pendente</span>'
                    }

                </td>

                <td>
                   <button class="btn btn-success btn-sm" onclick="concluirTarefa(${tarefa.id})"> Concluir </button>

                    <button
                        class="btn btn-warning btn-sm"
                        onclick="editarTarefa(${tarefa.id})">

                        Editar

                    </button>

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="excluirTarefa(${tarefa.id})">

                        Excluir

                    </button>

                </td>

            </tr>
            `;
        });

        document.getElementById("totalTarefas").innerText =
            tarefas.length;

        document.getElementById("pendentes").innerText =
            pendentes;

        document.getElementById("concluidas").innerText =
            concluidas;
    }

    async function editarTarefa(id){

        const response =
            await fetch(`${API}/${id}`);

        const tarefa =
            await response.json();

        document.getElementById("tarefaId").value =
            tarefa.id;

        document.getElementById("titulo").value =
            tarefa.titulo;

        document.getElementById("descricao").value =
            tarefa.descricao;

        document.getElementById("dataInicio").value =
            tarefa.dataInicio;

        document.getElementById("dataLimite").value =
            tarefa.dataLimite;

        document.getElementById("btnSalvar").innerText =
            "Atualizar Tarefa";
    }

    async function concluirTarefa(id){

        await fetch(`${API}/${id}`,{

            method:"PATCH"
        });

        carregarTarefas();
    }

    async function excluirTarefa(id){

        if(!confirm("Deseja excluir esta tarefa?")){
            return;
        }

        await fetch(`${API}/${id}`,{

            method:"DELETE"
        });

        carregarTarefas();
    }

    carregarTarefas();

</script>

</body>
</html>
